name: Build and Deploy Website

on:
    push:
        branches:
            - main # Runs whenever you push to main (change to 'master' if using master)
    workflow_dispatch: # Allows manual triggers from the Actions tab

permissions:
    contents: write # Grants permissions to commit to the gh-pages branch

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

            - name: Generate static site
              run: |
                  uv run python main.py
                  cp -r ./media/* ./dist/media/

            - name: Deploy to gh-pages branch
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./dist
                  publish_branch: gh-pages
